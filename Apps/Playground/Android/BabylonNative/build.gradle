plugins {
    id 'com.android.library'
}

def jsEngine = "V8"
if (project.hasProperty("jsEngine")) {
    jsEngine = project.property("jsEngine")
}

def graphics_api = project.hasProperty("GRAPHICS_API") ? project.property("GRAPHICS_API") : "Vulkan"
def platformVersion = ("${graphics_api}" == "Vulkan") ? 25 : 21

def unity_build = "false"
if (project.hasProperty("UNITY_BUILD")) {
    unity_build = project.property("UNITY_BUILD")
}
def arcore_libpath = "${buildDir}/arcore-native"

configurations { natives }

android {
    namespace 'com.library.babylonnative'
    compileSdk 34

    flavorDimensions += ["platform"]
    productFlavors {
        mobile {
            dimension "platform"
        }

        androidXr {
            dimension "platform"
            minSdkVersion 34
        }

        androidXrSimulator {
            dimension "platform"
            minSdkVersion 34
        }
    }

    defaultConfig {
        minSdk platformVersion
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        ndkVersion "28.2.13676358"
        if (project.hasProperty("NDK_VERSION")) {
            def NDKVersion = project.property("NDK_VERSION")
            ndkVersion  "${NDK_VERSION}"
        }
        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
                arguments "-DANDROID_STL=c++_shared",
                    "-DENABLE_PCH=OFF",
                    "-DNAPI_JAVASCRIPT_ENGINE=${jsEngine}",
                    "-DBABYLON_NATIVE_BUILD_APPS=ON",
                    "-DCMAKE_UNITY_BUILD=${unity_build}",
                    "-DBABYLON_DEBUG_TRACE=ON"
            }
        }
        ndk {
            if (project.hasProperty("ARM64Only")) {
                abiFilters "arm64-v8a"
            } else {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            }
        }
        packagingOptions {
            exclude '**/libarcore_sdk_c.so'
        }
    }

    productFlavors.all { flavor ->
        flavor.externalNativeBuild {
            cmake {
                if (flavor.name == "androidXr" || flavor.name == "androidXrSimulator") {
                    arguments "-DGRAPHICS_API=${graphics_api}", "-DBABYLON_NATIVE_ANDROID_XR=ON"
                } else {
                    arguments "-DGRAPHICS_API=${graphics_api}", "-DBABYLON_NATIVE_ANDROID_XR=OFF", "-DARCORE_LIBPATH=${arcore_libpath}/jni"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            version '3.19.6+'
            path 'CMakeLists.txt'
            buildStagingDirectory "../../../../Build/Android"
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/*/libv8android.so', 'lib/*/libjsc.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        androidXr {
            java.srcDirs += ["src/androidXrShared/java"]
        }

        androidXrSimulator {
            java.srcDirs += ["src/androidXrShared/java"]
        }
    }
}

dependencies {
    // ARCore library
    implementation 'com.google.ar:core:1.45.0'
    natives 'com.google.ar:core:1.45.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Android XR (Jetpack XR + SceneCore). Only used by androidXr/androidXrSimulator flavors.
    androidXrImplementation 'androidx.xr.scenecore:scenecore:1.0.0-alpha10'
    androidXrSimulatorImplementation 'androidx.xr.scenecore:scenecore:1.0.0-alpha10'
}


// Extracts the shared libraries from aars in the natives configuration.
// This is done so that NDK builds can access these libraries.
task extractNativeLibraries() {
    // Always extract, this insures the native libs are updated if the version changes.
    outputs.upToDateWhen { false }
    doFirst {
        configurations.natives.files.each { f ->
            copy {
                from zipTree(f)
                into arcore_libpath
                include "jni/**/*"
            }
        }
    }
}

tasks.configureEach { task ->
    if ((task.name.contains("buildCMake") || task.name.contains("configureCMake")) && !task.name.contains("Clean")) {
        task.dependsOn(extractNativeLibraries)
    }
}
