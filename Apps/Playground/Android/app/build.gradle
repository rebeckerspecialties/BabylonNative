apply plugin: 'com.android.application'

def jsEngine = "V8"
if (project.hasProperty("jsEngine")) {
    jsEngine = project.property("jsEngine")
}

def platformVersion = 25
def scriptsOut = "${buildDir}/generated/assets/Scripts"

def unity_build = "false"
if (project.hasProperty("UNITY_BUILD")) {
    unity_build = project.property("UNITY_BUILD")
}
def arcore_libpath = "${buildDir}/arcore-native"

configurations { natives }

// Jetpack XR pulls in androidx.lifecycle 2.8.x which is published as Kotlin multiplatform.
// Our Java-only build can resolve the non-Android (desktop JVM) variant, which is missing
// Android-only classes used by ComponentActivity and androidx.startup at runtime.
configurations.configureEach {
    resolutionStrategy {
        force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
        force 'androidx.lifecycle:lifecycle-process:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2'
    }
}

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.android.babylonnative.playground"
        minSdkVersion "${platformVersion}"
        targetSdkVersion 34
        ndkVersion "28.2.13676358"
        if (project.hasProperty("NDK_VERSION")) {
            def NDKVersion = project.property("NDK_VERSION")
            ndkVersion  "${NDK_VERSION}"
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/*/libv8android.so', 'lib/*/libjsc.so', 'lib/*/libBabylonNativeJNI.so', 'lib/*/libc++_shared.so']
        }
    }

    buildTypes {
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            debuggable true
        }
    }

    flavorDimensions += ["platform"]
    productFlavors {
        mobile {
            dimension "platform"
        }

        androidXr {
            dimension "platform"
            applicationIdSuffix ".xr"
            minSdkVersion 34
        }

        androidXrSimulator {
            dimension "platform"
            applicationIdSuffix ".xrsim"
            minSdkVersion 34
        }
    }

    namespace 'com.android.babylonnative.playground'

    sourceSets {
        main {
            assets.srcDirs = ["${buildDir}/generated/assets"]
        }

        androidXr {
            java.srcDirs += ["src/androidXrShared/java"]
            res.srcDirs += ["src/androidXrShared/res"]
        }

        androidXrSimulator {
            java.srcDirs += ["src/androidXrShared/java"]
            res.srcDirs += ["src/androidXrShared/res"]
        }
    }
}

repositories {
    // Intentionally empty. Dependencies are provided by project(':BabylonNative') and Maven repositories above.
}

dependencies {
    implementation project(':BabylonNative')
    implementation 'com.google.ar:core:1.45.0'
    natives 'com.google.ar:core:1.45.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Android XR (Jetpack XR + SceneCore). Needed directly by the app's XR launcher activity.
    androidXrImplementation 'androidx.xr.scenecore:scenecore:1.0.0-alpha10'
    androidXrSimulatorImplementation 'androidx.xr.scenecore:scenecore:1.0.0-alpha10'
}

// Extracts the shared libraries from aars in the natives configuration.
// This is done so that NDK builds can access these libraries.
task extractNativeLibraries() {
    // Always extract, this insures the native libs are updated if the version changes.
    outputs.upToDateWhen { false }
    doFirst {
        configurations.natives.files.each { f ->
            copy {
                from zipTree(f)
                into arcore_libpath
                include "jni/**/*"
            }
        }
    }
}

tasks.configureEach { task ->
    if ((task.name.contains("buildCMake") || task.name.contains("configureCMake")) && !task.name.contains("Clean")) {
        task.dependsOn(extractNativeLibraries)
    }
}

preBuild.dependsOn ':BabylonNative:assembleRelease'

def copyFiles = tasks.register("copyFiles", Copy) {
    description = "Stage JS assets into build output"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    into scriptsOut
    from('../../../node_modules/babylonjs') { include "babylon.max.js" }
    from('../../../node_modules/babylonjs-loaders') { include "babylonjs.loaders.js" }
    from('../../../node_modules/babylonjs-materials') { include "babylonjs.materials.js" }
    from('../../../node_modules/babylonjs-gui') { include "babylon.gui.js" }
    from('../../../node_modules/babylonjs-serializers') { include "babylonjs.serializers.js" }
    from('../../../Dependencies') { include "*.js" }
    from('../../Scripts') { include "*.js" }
}

preBuild.dependsOn(copyFiles)

afterEvaluate {
    if (tasks.findByName("installDebug") == null) {
        tasks.register("installDebug") {
            group = "install"
            dependsOn("installMobileDebug")
        }
    }
}
